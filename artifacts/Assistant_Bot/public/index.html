<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Assistant Bangladesh</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-dark">
  <div id="app">
    <header class="topbar">
      <button id="closeBtn" class="pill anim-btn" type="button">✕ Close</button>
      <div class="online"><span class="dot"></span> <span id="onlineCount">35,000 online</span></div>
      <button class="circle-btn anim-btn" id="menuBtn" type="button">⋮</button>
    </header>

    <main id="content" class="page-enter"></main>

    <div id="toast"></div>
    <div id="floatNotif" class="float-notif"></div>
    <div id="modalRoot"></div>

    <nav class="bottom-nav">
      <button data-page="trade" class="nav-btn anim-btn active" type="button"><span class="ico">⇄</span><small>Trade</small></button>
      <button data-page="friends" class="nav-btn anim-btn" type="button"><span class="ico">👥</span><small>Friends</small></button>
      <button data-page="farm" class="nav-btn center-btn anim-btn" type="button"><span class="ico">$</span><small>Farm</small></button>
      <button data-page="gifts" class="nav-btn anim-btn" type="button"><span class="ico">🎁</span><small>Gifts</small></button>
      <button data-page="account" class="nav-btn anim-btn" type="button"><span class="ico">👤</span><small>Account</small></button>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
