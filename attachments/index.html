<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101a39">
  <title>NOVUM.AI • VIP Agent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="closeBtn" class="top-control close-control"><span class="x">×</span> Close</button>
      <div class="online"><i></i><span>0 online</span></div>
      <div class="top-actions">
        <button class="top-control icon-control" id="collapseBtn" aria-label="Menu">⌄</button>
        <button class="top-control icon-control" id="menuBtn" aria-label="More">⋮</button>
      </div>
    </header>

    <main id="content"></main>

    <div id="payoutToast" class="payout-toast" aria-live="polite">
      <div class="payout-icon">⇩</div>
      <div><b id="payoutName">@user</b><strong>successfully</strong><span>withdraws <em id="payoutAmount">$0.1 USDT</em></span></div>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-page="trade"><span class="nav-icon">⇄</span><small>Trade</small></button>
      <button data-page="friends"><span class="nav-icon">♧</span><small>Friends</small></button>
      <button data-page="farm"><span class="nav-icon">＄</span><small>Farm</small></button>
      <button data-page="gifts"><span class="nav-icon">♔</span><small>Gifts</small></button>
      <button data-page="account"><span class="nav-icon">♙</span><small>Account</small></button>
    </nav>
  </div>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
