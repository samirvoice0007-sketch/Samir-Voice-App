<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Lucky Fest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="closeBtn" class="top-control close-control" type="button"><span class="x">×</span> Close</button>
      <div class="online"><i></i><span id="onlineCount">35,000 online</span></div>
      <div class="top-actions">
        <button class="top-control icon-control" id="collapseBtn" type="button" aria-label="Menu">⌄</button>
        <button class="top-control icon-control" id="menuBtn" type="button" aria-label="More">⋮</button>
      </div>
    </header>

    <main id="content" class="page"></main>

    <div id="payoutToast" class="payout-toast" aria-live="polite">
      <div class="payout-icon">⇩</div>
      <div>
        <b id="payoutName">@user</b>
        <strong>successfully</strong>
        <span>withdraws <em id="payoutAmount">$0.1 USDT</em></span>
      </div>
    </div>

    <div id="floatNotif" class="float-notif"></div>
    <div id="modalRoot"></div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-page="trade" class="nav-btn active" type="button"><span class="nav-icon">⇄</span><small>Trade</small></button>
      <button data-page="friends" class="nav-btn" type="button"><span class="nav-icon">♧</span><small>Friends</small></button>
      <button data-page="farm" class="nav-btn center-btn" type="button"><span class="nav-icon">＄</span><small>Farm</small></button>
      <button data-page="gifts" class="nav-btn" type="button"><span class="nav-icon">♔</span><small>Gifts</small></button>
      <button data-page="tasks" class="nav-btn" type="button"><span class="nav-icon">📋</span><small>Tasks</small></button>
      <button data-page="account" class="nav-btn" type="button"><span class="nav-icon">♙</span><small>Account</small></button>
    </nav>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
